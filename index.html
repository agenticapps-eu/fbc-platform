<!doctype html>
<!-- data-variant: Default 'hell' (AGE-492); das Inline-Skript unten korrigiert
     VOR dem First Paint auf den gespeicherten Wert (kein Theme-Flash). -->
<html lang="de" data-variant="hell">
  <head>
    <meta charset="UTF-8" />
    <!-- AGE-642 C1: `viewport-fit=cover` MUSS hier stehen, sonst liefern alle
         `env(safe-area-inset-*)` in index.css den Wert 0 und jede Regel dort
         ist wirkungslos. Am 28.08. auf einem iPhone 17 Pro gemessen: ohne das
         Meta liegt der Kopf der Hülle unter der Statusleiste, und der
         Anmelden-Knopf ist nicht erreichbar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/brand/compass-favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/compass-favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>eff.bee.zee — Business-Netzwerk auf Werten</title>
    <meta
      name="description"
      content="Das Business-Netzwerk, das auf Werten statt Visitenkarten aufbaut: Mitglieder kennenlernen, Events entdecken und die richtigen Verbindungen finden."
    />

    <!-- Vorschau in Mail, WhatsApp und Chat. Ohne diese Zeilen erscheint der
         Link ohne Titel, ohne Beschreibung und ohne Bild — die erste Begegnung
         mit der Plattform findet aber genau dort statt.

         og:url zeigt bewusst auf die AUSGELIEFERTE Fläche. `effbeezee.com` und
         `app.fairbusinessclub.de` antworten heute nicht (gemessen 22.08.: nur
         `fbc-platform.pages.dev` liefert 200); eine Vorschau auf eine tote
         Adresse wäre schlimmer als keine. Beim Umzug auf die eigene Domain
         gehört diese Zeile mitgeändert.

         og:image fehlt bewusst und ist die einzige offene Zeile hier: es gibt
         kein Bild, das dafür taugt — die Heldenbilder sind Unsplash-Fotos im
         Format 3:2 als WebP, das viele Vorschau-Dienste (WhatsApp) nicht
         darstellen. Gebraucht wird ein eigenes Motiv, 1200×630, als JPEG oder
         PNG. Kommt es, gehört `twitter:card` auf `summary_large_image` — ohne
         Bild zeigt `summary` die richtige, kleine Karte. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eff.bee.zee" />
    <meta property="og:title" content="eff.bee.zee — Business-Netzwerk auf Werten" />
    <meta
      property="og:description"
      content="Das Business-Netzwerk, das auf Werten statt Visitenkarten aufbaut: Mitglieder kennenlernen, Events entdecken und die richtigen Verbindungen finden."
    />
    <meta property="og:url" content="https://fbc-platform.pages.dev/" />
    <meta property="og:locale" content="de_DE" />
    <meta name="twitter:card" content="summary" />
    <!-- Anti-Flash: setzt data-variant VOR dem ersten Paint. Ohne das lädt die
         App sichtbar hell und springt danach auf navy.

         Die Regel hier muss mit resolveInitialVariant (src/config/designVariants.ts)
         übereinstimmen, sonst korrigiert der Provider diesen Wert danach sichtbar
         zurück — genau der Flash, den das Skript verhindern soll.

         Der Serverwert (member_settings.theme) steht hier prinzipbedingt noch
         nicht zur Verfügung; er kommt erst nach dem Login-Roundtrip und
         überschreibt dann localStorage. -->
    <script>
      (function () {
        try {
          var ok = ["hell", "navy"];
          var s = localStorage.getItem("fbc.designVariant");
          document.documentElement.dataset.variant = ok.indexOf(s) > -1 ? s : "hell";
        } catch (e) {}
      })();
    </script>

    <!-- AGE-642 B5: schaltet die Boot-Flaeche unten frei — nativ ja, Browser nein.

         WARUM HIER UND NICHT IM ANWENDUNGSCODE. Die Flaeche steht als Markup im
         ausgelieferten Dokument und wird gezeichnet, BEVOR irgendein Modul
         laedt. `Capacitor.isNativePlatform()` aus `@capacitor/core` kaeme damit
         zu spaet — und ohne Entscheidung erschiene die Flaeche auch im Browser.

         WARUM `window.Capacitor` HIER SCHON DA IST: Capacitor spritzt
         `native-bridge.js` vor jedem Skript des Dokuments ein — auf iOS als
         `WKUserScript` mit `injectionTime: .atDocumentStart`
         (`JSExport.swift:20,107`), auf Android ueber
         `WebViewCompat.addDocumentStartJavaScript` (`Bridge.java:266`).

         UND WENN NICHT: dann faellt der Ausdruck auf `false`, das Attribut
         bleibt weg, und es gilt genau das Verhalten von vor dieser Aenderung.
         Ein Fehlschlag kostet die Verbesserung, nicht die Anwendung. -->
    <script>
      (function () {
        try {
          if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
            document.documentElement.dataset.boot = "nativ";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- AGE-642 B5: die Boot-Flaeche — dieselbe Komposition wie der native
         Startbildschirm (`LaunchScreen.storyboard`), damit zwischen ihm und dem
         ersten Bild der Anwendung keine leere Flaeche steht.

         Gemessen am 07.09.: die Luecke dauert 40 ms (dieser Mac) bis 228 ms
         (6-fache CPU-Bremse) und zeigt in den oberen 20 % nichts (`#f6f8fb`,
         Streuung 0), wo der Startbildschirm ein Foto zeigt (Streuung 67).

         SIE STEHT IN `#root`, und das ist Absicht: React raeumt den Inhalt des
         Containers beim ersten `render()` selbst weg. Es braucht also keinen
         Aufraeum-Code, der vergessen werden koennte — und die Flaeche
         verschwindet genau in dem Bild, in dem die Anwendung erscheint, nicht
         davor.

         Sichtbar wird sie nur ueber `html[data-boot="nativ"]` (Skript oben).
         Die zwei Bilder haengen deshalb an CSS-`url()` und nicht an `<img>`:
         ein `<img>` wird auch dann geladen, wenn es auf `display: none` steht,
         ein Hintergrundbild nicht. Im Browser kostet die Flaeche damit
         null Bytes. -->
    <div id="root">
      <div class="boot-flaeche" aria-hidden="true">
        <div class="boot-flaeche__band"></div>
        <div class="boot-flaeche__schriftzug"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
