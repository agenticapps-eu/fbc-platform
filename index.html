<!doctype html>
<!-- data-variant: Default 'sommerfest' (FBC-Marke, AGE-361); das Inline-Skript unten
     korrigiert VOR dem First Paint auf URL/localStorage (kein Theme-Flash). -->
<html lang="de" data-variant="sommerfest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/crown-favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/crown-favicon.svg" />
    <meta name="theme-color" content="#14151a" />
    <title>Fair Business Club</title>
    <!-- Anti-Flash: setzt data-variant vor dem Rendern, gleiche Precedence wie der
         DesignVariantProvider (URL ?variant= > localStorage > Default 'sommerfest'). -->
    <script>
      (function () {
        try {
          var ok = ["a", "b", "c", "d", "e", "f", "g", "h", "i", "sommerfest", "linkedin"];
          // Strukturelle Flags der experimentellen Varianten (cardStyle, backdrop).
          // a–d sind solid/none (Default); nur e/f/g weichen ab.
          var flags = { e: ["editorial", "none"], f: ["glass", "aurora"], g: ["solid", "paper"] };
          var p = new URLSearchParams(location.search).get("variant");
          var s = localStorage.getItem("fbc.designVariant");
          var v = ok.indexOf(p) > -1 ? p : ok.indexOf(s) > -1 ? s : "sommerfest";
          var d = document.documentElement;
          var fl = flags[v];
          d.dataset.variant = v;
          d.dataset.cardStyle = fl ? fl[0] : "solid";
          d.dataset.backdrop = fl ? fl[1] : "none";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
