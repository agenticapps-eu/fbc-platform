<!doctype html>
<!-- data-variant: Default 'hell' (AGE-492); das Inline-Skript unten korrigiert
     VOR dem First Paint auf den gespeicherten Wert (kein Theme-Flash). -->
<html lang="de" data-variant="hell">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/crown-favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/crown-favicon.svg" />
    <meta name="theme-color" content="#ffffff" />
    <title>Fair Business Club</title>
    <!-- Anti-Flash: setzt data-variant VOR dem ersten Paint. Ohne das lädt die
         App sichtbar hell und springt danach auf navy.

         Die Regel hier muss mit resolveInitialVariant (src/config/designVariants.ts)
         übereinstimmen, sonst korrigiert der Provider diesen Wert danach sichtbar
         zurück — genau der Flash, den das Skript verhindern soll.

         Der Serverwert (member_settings.theme) steht hier prinzipbedingt noch
         nicht zur Verfügung; er kommt erst nach dem Login-Roundtrip und
         überschreibt dann localStorage. -->
    <script>
      (function () {
        try {
          var ok = ["hell", "navy"];
          var s = localStorage.getItem("fbc.designVariant");
          document.documentElement.dataset.variant = ok.indexOf(s) > -1 ? s : "hell";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
