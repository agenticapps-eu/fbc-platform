apply plugin: 'com.android.application'

// ══ SIGNATURMATERIAL (AGE-642 B3) ══════════════════════════════════════════
// `key.properties` und der Keystore daneben liegen NICHT im Repo — es ist
// oeffentlich. Beide entstehen vor einem Release-Bau aus Infisical:
//   infisical run --env=prod -- pnpm android:keystore
//
// Gelesen wird hier nur, was da ist. Ein DEBUG-Bau darf nie an dieser Datei
// haengen: der taegliche Rundlauf am Geraet laeuft ueber `assembleDebug`, und
// ein Gradle, das dort nach dem Signaturmaterial verlangte, machte jede
// Messung von einem Secret abhaengig, das mit ihr nichts zu tun hat.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def keystoreVorhanden = keystorePropertiesFile.exists()
if (keystoreVorhanden) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.effbeezee.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.effbeezee.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystoreVorhanden) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystoreVorhanden) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// ══ DER STILLE AUSGANG, DEN DIESE ZEILEN VERHINDERN ════════════════════════
// Ohne `key.properties` bleibt oben `signingConfig` ungesetzt. Gradle bricht
// dann NICHT ab, sondern erzeugt klaglos ein UNSIGNIERTES Release-Artefakt:
// der Lauf ist gruen, das Buendel unbrauchbar, und es faellt erst beim
// Hochladen zu Play auf — eine Stufe zu spaet und weit weg von der Ursache.
//
// Der Abbruch haengt deshalb an den Release-Aufgaben und nur an ihnen. Waere
// er stattdessen oben beim Einlesen, braeche er auch `assembleDebug`.
//
// `package` steht bewusst in der Liste, nicht nur `assemble`/`bundle`: gemessen
// am 04.09. laeuft `packageRelease` VOR `assembleRelease` durch und legt dabei
// `app-release-unsigned.apk` ab. Der Bau scheiterte auch so — aber er liesse
// eine unsignierte Datei mit plausiblem Namen im Ausgabeordner zurueck, und die
// naechste Hand, die dort `*.apk` einsammelt, faende sie.
tasks.matching { it.name ==~ /^(assemble|bundle|package)Release.*/ }.configureEach {
    doFirst {
        if (!keystoreVorhanden) {
            throw new GradleException(
                "android/key.properties fehlt — das Release-Artefakt waere unsigniert.\n" +
                "Erzeugen mit:\n" +
                "  infisical run --env=prod -- pnpm android:keystore")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ══ FEHLT DIE DATEI, BRICHT DER BAU (AGE-642) ══════════════════════════════
// Capacitors Vorlage stand hier als `try`/`catch` mit einer info-Logzeile. Sie
// baute eine Schale, in der Firebase nicht initialisiert — und in der
// `PushNotifications.register()` den Prozess auf dem nativen Plugin-Thread
// toetet, sobald jemand die Benachrichtigungen erlaubt. Gemessen am 03.09. am
// Pixel 11 Pro: Erlaubnis erteilt, App startet nie wieder.
//
// Das `try/catch` in `src/lib/push.ts` kann das prinzipiell nicht fangen; die
// Ausnahme fliegt ausserhalb des JS-Kontexts. Der einzige Ort, an dem das
// Fehlen ueberhaupt noch harmlos ist, ist dieser hier — Minuten vor dem Geraet.
//
// Der Preis ist benannt: ohne das Secret laesst sich Android nicht mehr bauen.
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists() || servicesJSON.text.trim().isEmpty()) {
    throw new GradleException(
        "android/app/google-services.json fehlt. Erzeugen mit:\n" +
        "  infisical run --env=dev -- pnpm android:firebase")
}
apply plugin: 'com.google.gms.google-services'
