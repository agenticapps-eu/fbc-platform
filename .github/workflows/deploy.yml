name: Deploy

# Pull requests -> Cloudflare Pages preview deploy.
# Push to main   -> production deploy + Sentry release (commits + source-maps).
#
# Secrets are injected by the Infisical CLI (`infisical run`) using a single
# service token (INFISICAL_TOKEN). prod env on main, dev env for previews.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per ref; a newer push supersedes an older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # Migrationen automatisch auf DEV, sobald sie auf main liegen (AGE-257).
  #
  # NICHT auf Pull Requests: sonst mutierte jeder offene PR das DEV-Projekt mit
  # ungereviewten Migrationen, und zwei parallele PRs schrieben sich gegenseitig
  # in die Historie.
  #
  # Warum DEV automatisch und PROD nicht: `ci.yml` belegt mit `supabase db
  # reset` nur, dass eine Migration auf eine LEERE Datenbank passt. Ein `not
  # null` ohne Default auf einer gefuellten Tabelle ist in CI gruen und
  # scheitert erst an Daten. Genau das faengt dieser Lauf ab, wo es folgenlos
  # ist.
  migrate-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Stufe 1 auch hier — dieselbe gepruefte Funktion wie `pnpm db:push:prod`.
      # Ohne sie schriebe dieser Job unbeaufsichtigt auf das Projekt, das
      # zufaellig im Secret steht: stuende dort die PROD-URL, liefen Migrationen
      # bei jedem Merge ohne Bestaetigung auf die Produktivdatenbank — und
      # `drift-gate` waere danach gruen, weil PROD dann zum Repo passt.
      # Ein unabhaengiges Review hat diese Luecke am 2026-08-05 gefunden.
      - name: Ziel pruefen — muss das DEV-Projekt sein
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: pnpm tsx scripts/assert-target.ts dev

      - name: Migrationen auf DEV anwenden
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_DEV"

  # Fruehwarnung vor dem Deploy: weicht die Migrationshistorie des Projekts ab,
  # das der auszuliefernde Build anspricht, faehrt kein Frontend aus (AGE-257).
  #
  # Misst gegen denselben `github.sha`, den `deploy` ausliefert — beide Jobs
  # liegen im selben Lauf und checken denselben Commit aus.
  #
  # WARUM NICHT MEHR FEST GEGEN PROD (AGE-536). Solange „Bis zum Import traegt
  # allein DEV die Rolle beider Umgebungen" gilt, zeigt `VITE_SUPABASE_URL` der
  # Infisical-Umgebung `prod` auf das DEV-Projekt — das ausgelieferte Frontend
  # liest also aus DEV. Ein fest gegen PROD gerichtetes Gate mass damit eine
  # Datenbank, die kein Nutzer anfasst, und hielt dabei genau das Frontend
  # zurueck, das zur tatsaechlich gelesenen Datenbank passt. Am 2026-08-13
  # standen dadurch drei Stunden lang neun leere Karten live: `migrate-dev`
  # hatte die Event-Beitraege in DEV angelegt, das Frontend, das diesen
  # Kartentyp kennt, kam wegen Drift gegen PROD nicht heraus. Das Gate hat den
  # Schaden nicht verhindert, sondern verlaengert.
  #
  # Nach dem Umzug auf das PROD-Projekt ergibt dieselbe Regel wieder PROD —
  # ohne Aenderung an dieser Datei.
  #
  # WARUM `needs: migrate-dev`. Sobald das Gate DEV misst, misst es dasselbe
  # Projekt, das `migrate-dev` im selben Lauf gerade beschreibt. Parallel
  # gestartet faende es die eben gemergten Migrationen als fehlend und wuerde rot
  # — nicht wegen einer echten Abweichung, sondern wegen der Reihenfolge der
  # eigenen Pipeline. Das kostet echte Laufzeit — vorher startete `deploy` bei
  # `max(migrate-dev, drift-gate)`, jetzt bei `migrate-dev + drift-gate`, plus
  # der Infisical-Installation unten. Rund zwei Minuten je Push auf main, und
  # sie sind es wert: ohne die Reihenfolge misst das Gate den Stand VOR der
  # Migration und wird an der eigenen Pipeline rot.
  #
  # Kein Break-Glass, bewusst: sobald ein Merge eine Migration enthaelt, die das
  # gemessene Projekt nicht hat, blockiert dieses Gate JEDEN Deploy — auch einen
  # eiligen Fix, der mit der Migration nichts zu tun hat. Eine Zusage, die man im
  # Eilfall umgehen darf, ist im Eilfall keine.
  #
  # EHRLICH ZUR REICHWEITE, solange DEV live ist: das Gate misst dann eine
  # Datenbank, die unmittelbar zuvor in diesem Lauf automatisch migriert wurde.
  # Es ist in dieser Zeit eine Nachkontrolle von `migrate-dev` (plus
  # Remote-only-Drift und Reihenfolge), keine Zusage, dass ein Mensch die
  # Migration freigegeben haette. Was in dieser Phase traegt, ist der Abbruch des
  # Deploys bei fehlgeschlagenem DEV-Lauf.
  drift-gate:
    needs: [migrate-dev]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      # Our Infisical org is on EU Cloud; the CLI defaults to US otherwise.
      INFISICAL_API_URL: https://eu.infisical.com/api
      # DIESELBE Umgebung, mit der `deploy` auf main baut. Wuerde hier eine
      # andere stehen, maesse das Gate wieder ein anderes Projekt als das
      # ausgelieferte Frontend anspricht — der Fehler, den dieser Job behebt.
      INFISICAL_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gleiche Installation wie in `functions` und `deploy`. Ein Checksum-Pin
      # ist nicht zu haben — Infisical verteilt die CLI ueber sein eigenes
      # Repository (offener Punkt aus AGE-495, Audit 8.6). Kein `-E`: das
      # Setup-Skript braucht nichts aus dieser Job-Umgebung.
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical

      # Die Zuordnung steht in scripts/live-target.logic.ts und hat dort einen
      # Test daneben — samt Regressionsfall auf den Vorfall, der sie ausgeloest
      # hat. Nicht hier als Shell-Zeile, die niemand prueft.
      #
      # STDOUT traegt genau zwei Zeilen (Umgebung, Ref), alles Erklaerende geht
      # nach STDERR — deshalb die Datei statt einer Kommandosubstitution.
      #
      # Geprueft werden BEIDE Zeilen und ihre ANZAHL. `live-target.ts` haelt sich
      # daran, aber dazwischen liegen `infisical`, `pnpm` und `tsx`: schriebe
      # eines davon eine Zeile auf STDOUT, liefen `head` und `tail` auseinander,
      # und bei einzeiliger Ausgabe lieferten beide denselben Wert — `ref` hiesse
      # dann „dev". Diese Angabe soll im Vorfall belastbar sein, also wird sie
      # geprueft und nicht angenommen.
      - name: Ziel bestimmen — welches Projekt spricht der Build an?
        id: ziel
        run: |
          set -euo pipefail
          infisical run --env="$INFISICAL_ENV" --silent -- \
            pnpm tsx scripts/live-target.ts > "$RUNNER_TEMP/ziel.txt"

          zeilen="$(wc -l < "$RUNNER_TEMP/ziel.txt" | tr -d ' ')"
          if [ "$zeilen" != "2" ]; then
            echo "::error::live-target.ts hat $zeilen Zeilen auf STDOUT geschrieben, erwartet waren 2. Schreibt ein Werkzeug in der Kette dazwischen?"
            exit 1
          fi

          umgebung="$(head -n 1 "$RUNNER_TEMP/ziel.txt")"
          ref="$(tail -n 1 "$RUNNER_TEMP/ziel.txt")"

          case "$umgebung" in
            dev|prod) ;;
            *) echo "::error::Unerwartete Ausgabe von live-target.ts: \"$umgebung\"." ; exit 1 ;;
          esac

          case "$ref" in
            [a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z][a-z]) ;;
            *) echo "::error::\"$ref\" ist kein Supabase-Projekt-Ref (20 Kleinbuchstaben)." ; exit 1 ;;
          esac

          echo "umgebung=$umgebung" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

          # In JEDEN Lauf, auch in den unauffaelligen: eine Angabe, die nur im
          # Ausnahmefall erscheint, ist im Normalfall unbelegt — und beim
          # naechsten Vorfall will niemand rekonstruieren muessen, welche
          # Datenbank das Gate damals angesehen hat.
          {
            echo "### Drift-Gate"
            echo "- gemessen: **$umgebung** (\`$ref\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Das Gate wird rot, wenn es nicht messen KANN (fehlendes Secret, DB
      # nicht erreichbar, geaendertes CLI-Ausgabeformat) — nicht nur, wenn es
      # Drift findet. Die Auswertung ist in scripts/migration-drift.logic.ts
      # geprueft; `version: latest` oben heisst, dass die CLI sich unter uns
      # aendern darf, und genau das ist am 2026-08-05 passiert.
      - name: Migrationshistorie gegen das gemessene Projekt vergleichen
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          UMGEBUNG: ${{ steps.ziel.outputs.umgebung }}
        run: |
          set -euo pipefail
          # Kein `else` auf PROD: ein unerwarteter Wert — auch der leere — waehlte
          # sonst stillschweigend das PROD-Secret, und ein Gate, dessen einziger
          # Fehlermodus „hat die falsche Datenbank gemessen" ist, darf genau das
          # nicht als Vorgabe haben. Heute unerreichbar (das `case` oben laesst
          # nur dev|prod durch), aber die Vorgabe soll auch dann richtig sein,
          # wenn jemand das `case` umbaut.
          case "$UMGEBUNG" in
            dev)  ziel="${SUPABASE_DB_URL_DEV:-}" ;;
            prod) ziel="${SUPABASE_DB_URL_PROD:-}" ;;
            *)    echo "::error::Unerwartete Umgebung \"$UMGEBUNG\" — das Gate misst nichts auf Verdacht." ; exit 1 ;;
          esac
          if [ -z "$ziel" ]; then
            echo "::error::Kein Verbindungs-Secret fuer \"$UMGEBUNG\". Das Gate kann nicht messen und wird deshalb rot."
            exit 1
          fi

          # Belegen, dass das Secret auch wirklich auf das aufgeloeste Projekt
          # zeigt. Ohne diese Zeile prueft das Gate nur ein ETIKETT: es weiss,
          # welches Projekt der Build anspricht, nimmt aber ungeprueft an, dass
          # `SUPABASE_DB_URL_<UMGEBUNG>` dorthin fuehrt. Waere das Secret
          # vertauscht — beim Umzug die wahrscheinlichste Verwechslung —, maesse
          # das Gate ein anderes Projekt als der Build anspricht und waere gruen.
          # Dieselbe gepruefte Funktion wie in `migrate-dev` und `migrate-prod`.
          pnpm tsx scripts/assert-target.ts "$UMGEBUNG"

          pnpm tsx scripts/migration-drift-gate.ts "$ziel"

      # NUR BERICHT, NIE ROT. Zeigt der Build auf DEV, entfiele sonst jede
      # Sichtbarkeit von PRODs Rueckstand — und genau der ist zweimal unbemerkt
      # gewachsen und fiel erst auf, als ein Deploy scheiterte.
      #
      # `!cancelled()` statt `always()`: der Bericht soll auch dann entstehen,
      # wenn das Gate oben rot war — da ist er am meisten wert —, aber nicht
      # noch anlaufen, waehrend der Lauf abgebrochen wird.
      #
      # `set +e` AUSDRUECKLICH — und das ist der Punkt. GitHub startet jeden
      # `run:`-Block als `bash -e {0}`; errexit ist an, BEVOR die erste Zeile
      # laeuft, und `set -uo pipefail` loescht es nicht. Ohne `set +e` stuerbe
      # der Schritt an der ersten fehlgeschlagenen Messung, der ganze
      # Auswertungsblock waere toter Code, der Job wuerde rot — und der Deploy
      # waere wegen einer Datenbank blockiert, die niemand liest. Also genau die
      # Havarie, gegen die dieser Job geschrieben ist. Gefunden im Review am
      # 2026-08-13; die lokale Probe hatte mit `bash datei` statt `bash -e`
      # gemessen und deshalb nichts bemerkt.
      #
      # NICHT `|| true`: das setzte `$?` auf 0, jeder Rueckstand landete im Zweig
      # „abweichungsfrei" — die stille Falschauskunft, die dieser Schritt gerade
      # verhindern soll.
      #
      # Ein fehlschlagender Vergleich ist hier das ERWARTETE Ergebnis.
      # Unterschieden wird zwischen „Rueckstand" und „nicht ermittelbar".
      - name: Stand des anderen Projekts — nur Bericht
        if: ${{ !cancelled() && steps.ziel.outputs.umgebung != '' }}
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          UMGEBUNG: ${{ steps.ziel.outputs.umgebung }}
        run: |
          set +e
          set -uo pipefail
          if [ "$UMGEBUNG" = "dev" ]; then
            anderes="prod"; url="${SUPABASE_DB_URL_PROD:-}"
          else
            anderes="dev"; url="${SUPABASE_DB_URL_DEV:-}"
          fi

          echo "### Anderes Projekt (\`$anderes\`) — nur Bericht" >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$url" ]; then
            echo "- nicht ermittelbar: kein Verbindungs-Secret" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pnpm tsx scripts/migration-drift-gate.ts "$url" > "$RUNNER_TEMP/anderes.txt" 2>&1
          code=$?

          # `::error::` entschaerfen, bevor die Ausgabe im Protokoll landet. Das
          # Gate schreibt seine Befunde als Workflow-Kommandos; unveraendert
          # ausgegeben erzeugten sie rote Annotationen an einem gruenen Lauf —
          # ununterscheidbar von denen des echten Gates, samt der Aufforderung,
          # `migrate-prod` freizugeben. Die Lauf-Seite koennte dann nicht mehr
          # beantworten, ob und woran der Deploy haengt.
          sed 's/^::error::/::notice::/' "$RUNNER_TEMP/anderes.txt"

          if [ "$code" -eq 0 ]; then
            echo "- abweichungsfrei" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q 'DRIFT —' "$RUNNER_TEMP/anderes.txt"; then
            echo "- **Rueckstand** — vor dem naechsten Deploy gegen \`$anderes\` bedenken:" >> "$GITHUB_STEP_SUMMARY"
            grep -o 'DRIFT — .*' "$RUNNER_TEMP/anderes.txt" | sed 's/^/  - /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **nicht ermittelbar** (Exit $code) — das ist NICHT \"kein Rueckstand\"" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Edge Functions auf BEIDE Projekte ausrollen (AGE-506).
  #
  # WARUM ES DIESEN JOB GIBT. Bis hierher rollte CI zwei der drei Flaechen aus —
  # Frontend und Migrationen — und Functions gar nicht. Das ist zweimal
  # aufgeschlagen: bei AGE-495/B2 existierten die drei Aktivierungs-Functions auf
  # PROD ueberhaupt nicht, waehrend der Change als „live" galt; und der
  # Code-Review zu PR #133 musste melden, dass ein PR `send-activation` aendert,
  # ohne dass irgendetwas sie ausliefert. Die Gegenmassnahme war eine Merkregel.
  # Eine Regel, an die gedacht werden muss, ist genau das, was zweimal versagt hat.
  #
  # WARUM DIESELBEN VORBEDINGUNGEN WIE `deploy`. Eine Function kann eine
  # Datenbankfunktion aufrufen, die auf dem Ziel noch nicht angelegt ist — auf
  # PROD laufen Migrationen nur ueber `migrate-prod`, also von Hand. Liefe dieser
  # Job voraus, waere die Function dort sofort kaputt. `drift-gate` blockiert
  # bereits jeden Deploy, sobald PRODs Migrationshistorie vom Repo abweicht; die
  # Function erbt diesen Schutz, statt einen zweiten danebenzustellen.
  #
  # WARUM NUR GEAENDERTE. `supabase functions deploy` ohne Namen deployt alle
  # sechs. Auf PROD liegt fuer `notify-contact-request` bewusst ein aelterer
  # Stand (member-activation-flow, Aufgabe 11.4) — ein pauschaler Lauf zoege ihn
  # stillschweigend mit. Was uebergangen wird, steht deshalb NAMENTLICH im
  # Protokoll: eine Beschraenkung, die nicht ausgesprochen wird, liest sich
  # hinterher wie Vollstaendigkeit.
  #
  # WOMIT VERGLICHEN WIRD. Nicht mit `HEAD^`. `HEAD^..HEAD` beantwortet „was
  # aenderte dieser Merge"; gebraucht wird „was ist noch nicht ausgeliefert".
  # Die zwei sind nur solange dasselbe, wie JEDER Lauf ausliefert — und das ist
  # nicht zugesichert: steht `drift-gate` rot, wird dieser Job uebersprungen.
  # Genau das ist am 2026-08-07 passiert (Lauf 31211729060, Merge 36b662a): der
  # Merge aenderte `send-activation/index.ts`, der Folgelauf sah davon nichts
  # mehr, und aufs Ziel kam die Aenderung nur, weil der naechste Merge zufaellig
  # dieselbe Function anfasste. Basis ist deshalb der Stand des juengsten Laufs,
  # in dem dieser Job mit `success` endete.
  #
  # DER NAME DIESES JOBS IST TEIL DER MECHANIK. Die Basis wird ueber
  # `select(.name == "functions")` gefunden. Ein `name:` am Job oder eine
  # `strategy.matrix` (die Namen zu `functions (x)` macht) bricht die Suche
  # dauerhaft — deshalb unterscheidet `deploy-base.logic.ts` diesen Fall in der
  # Meldung von einem bloss zu kurzen Fenster.
  functions:
    needs: [migrate-dev, drift-gate]
    # Nur auf main, und nur wenn beide Vorbedingungen nicht fehlgeschlagen sind —
    # dieselbe Bedingung wie `deploy` eine Etage tiefer.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    # Am JOB, nicht am Workflow: dort steht `contents: read`, und was nicht
    # aufgefuehrt ist, ist damit `none`. Nur dieser eine Job liest Laufhistorie —
    # und `actions: read` kann strikt weniger als das `contents: write`, das ein
    # von CI umgesetztes Deploy-Tag gebraucht haette (siehe design.md, 5.).
    permissions:
      contents: read
      actions: read
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      # Our Infisical org is on EU Cloud; the CLI defaults to US otherwise.
      INFISICAL_API_URL: https://eu.infisical.com/api
      # WARUM `dev`, obwohl dieser Job auch auf PROD ausliefert. Ein
      # Supabase-PAT authentifiziert den BETREIBER gegen die Management-API und
      # gilt kontoweit — er ist kein dev- und kein prod-Wert. Er liegt seit
      # AGE-496 in `dev`; ihn zusaetzlich nach `prod` zu legen hiesse, dieselbe
      # Zugangsdatei an zwei Stellen zu fuehren, und bei der naechsten Rotation
      # wuerde eine davon vergessen. Eine Kopie, eine Wahrheit.
      INFISICAL_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Volle Historie, NICHT `2`. Die Vergleichsbasis liegt ausserhalb von
          # `HEAD^`, sobald ein Lauf ausfiel oder uebersprungen wurde — und dann
          # koennte weder `git diff` noch `git merge-base` sie aufloesen.
          fetch-depth: 0
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Gleiche Installation wie im `deploy`-Job weiter unten. Ein Checksum-Pin
      # ist nicht zu haben — Infisical verteilt die CLI ueber sein eigenes
      # Repository.
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical

      # Die Wahl steht in scripts/deploy-base.logic.ts und hat dort einen Test
      # daneben — samt Regressionstest auf den Vorfall, der sie ausgeloest hat.
      - name: Vergleichsbasis ermitteln
        id: basis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Gemessen wird das Ergebnis dieses JOBS, nicht das des Laufs: ein
          # uebersprungener Job macht einen Lauf nicht rot. Ueber die Lauf-Ebene
          # waere die Antwort heute zwar zufaellig richtig, aber nur ueber eine
          # Schlusskette, die ein kuenftiges `if:` still kippt.
          #
          # 30 Laeufe sind der Blick zurueck; reicht er nicht, greift der
          # Rueckfall weiter unten — laut.
          if ! laeufe="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&event=push&per_page=30" \
              --jq '.workflow_runs[] | {id, sha: .head_sha}' |
            while read -r lauf; do
              id="$(jq -r '.id' <<<"$lauf")"
              # `filter=latest` ist zwar die Vorgabe der API, steht hier aber
              # ausdruecklich: mit `filter=all` liefe `first` auf den AELTESTEN
              # Versuch, und ein Lauf, dessen erster Versuch gelang und dessen
              # zweiter scheiterte, laese sich als `success`. Das waere die
              # Richtung „Basis zu neu" — also ein stiller Ausfall.
              #
              # `</dev/null`, weil `gh` sonst stdin der `while`-Schleife
              # leerlesen koennte; die Liste waere dann nach einem Eintrag zu
              # Ende, ohne dass irgendetwas fehlschlaegt.
              #
              # Der leere Ersatzwert faengt zweierlei ab: kein `functions`-Job im
              # Lauf, und einer, der noch laeuft (etwa dieser hier). Weder das
              # eine noch das andere ist ein Nachweis, dass ausgeliefert wurde.
              if ! ergebnis="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest" \
                --jq '[.jobs[] | select(.name == "functions") | .conclusion] | first // ""' \
                </dev/null)"; then
                # OHNE dieses `if` verschwaende der Fehlschlag spurlos: `set -e`
                # ist in dieser verschachtelten Ersetzung abgeschaltet, weil sie
                # in der Bedingung eines `if !` steht. Der Lauf wuerde dann als
                # „kein functions-Job" gewertet — richtungssicher (die Basis wird
                # aelter), aber der GRUND im Protokoll behauptete danach einen
                # Erfolg in einem aelteren Lauf, den es so nie gab.
                echo "::warning::Job-Ergebnis fuer Lauf $id nicht abrufbar — der Lauf gilt als NICHT ausgeliefert." >&2
                ergebnis=""
              fi
              jq -c --arg e "$ergebnis" \
                '. + {functions: (if $e == "" then null else $e end)}' <<<"$lauf"
            done | jq -sc '.'
          )"; then
            echo "::warning::Laufhistorie nicht abrufbar — die Vergleichsbasis faellt auf HEAD^ zurueck."
            laeufe=""
          fi

          pnpm tsx scripts/deploy-base.ts <<<"$laeufe" > "$RUNNER_TEMP/basis.txt"
          sha="$(head -n 1 "$RUNNER_TEMP/basis.txt")"
          grund="$(tail -n 1 "$RUNNER_TEMP/basis.txt")"

          # Ein SHA aus der Laufhistorie muss nicht mehr in dieser Historie
          # liegen — nach einem Force-Push tut er es nicht, und `git diff` liefe
          # ins Leere.
          if [ -n "$sha" ] && ! git merge-base --is-ancestor "$sha" HEAD; then
            grund="$sha ist kein Vorfahr von HEAD (Force-Push oder History-Umbau)"
            sha=""
          fi

          # Rueckfall auf HEAD^, damit dieser Lauf wenigstens ausliefert, was er
          # sieht — aber er darf NICHT als Nachweis gelten (Entscheidung Donald,
          # 2026-08-08, nach dem Review). Die urspruengliche Begruendung „gegen
          # HEAD^ zu vergleichen ist das bisherige Verhalten, also nie
          # schlechter" gilt nur INNERHALB eines Laufs. Ueber Laeufe hinweg ist
          # sie falsch: die Basis wird aus der Laufhistorie gelesen, also wuerde
          # ein gruener Rueckfall-Lauf zur Basis des naechsten — und alles davor
          # Uebersprungene laege ab da DAUERHAFT ausserhalb jedes Diffs. Der alte
          # Code verlor eine Aenderung einmal und konnte sie durch Zufall
          # zurueckholen (genau das rettete 36b662a); ein gruener Rueckfall
          # naegelte diesen Fluchtweg zu.
          #
          # Deshalb setzt der Schritt `rueckfall` — der letzte Schritt des Jobs
          # laesst ihn daran scheitern. Rot heisst hier: dieser Lauf zaehlt nicht
          # als ausgeliefert, der naechste sieht die Luecke noch. Selbstheilend.
          rueckfall=""
          if [ -z "$sha" ]; then
            rueckfall="ja"
            if git rev-parse --verify -q "HEAD^" >/dev/null; then
              echo "::error::Vergleichsbasis nicht ermittelbar ($grund). Es wird gegen HEAD^ ausgeliefert, der Lauf endet aber ROT — sonst gaelte er als Nachweis und die Luecke waere dauerhaft."
              sha="$(git rev-parse HEAD^)"
              grund="RUECKFALL auf HEAD^ — $grund"
            else
              echo "::error::Weder Vergleichsbasis noch Vorgaenger-Commit vorhanden. Es wird nichts ausgeliefert."
              grund="RUECKFALL unmoeglich, kein Vorgaenger-Commit — $grund"
            fi
          fi

          {
            echo "sha=$sha"
            echo "grund=$grund"
            echo "rueckfall=$rueckfall"
          } >> "$GITHUB_OUTPUT"

          # In JEDEN Lauf, auch in den unauffaelligen. Eine Basis, die nur im
          # Ausnahmefall genannt wird, ist im Normalfall unbelegt — dieselbe
          # Begruendung wie beim namentlichen Protokoll der Uebergangenen.
          {
            echo "### Vergleichsbasis"
            echo "- gewaehlt: \`${sha:-<keine>}\`"
            echo "- Grund: $grund"
          } >> "$GITHUB_STEP_SUMMARY"

      # Die Ableitung steht in scripts/changed-functions.logic.ts und hat dort
      # einen Test daneben — nicht hier als Shell-Zeile, die niemand prueft.
      - name: Geaenderte Functions ableiten
        id: ableitung
        env:
          BASIS: ${{ steps.basis.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASIS" ]; then
            echo "namen=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          namen="$(git diff --name-only "$BASIS" HEAD | pnpm tsx scripts/changed-functions.ts | tr '\n' ' ')"
          echo "Abgeleitet seit $BASIS: ${namen:-<keine>}"
          echo "namen=$namen" >> "$GITHUB_OUTPUT"

      # Ohne Token kaeme aus der CLI eine unverstaendliche Meldung. Dieser Schritt
      # sagt stattdessen, was fehlt — und er schlaegt NUR fehl, wenn tatsaechlich
      # etwas auszuliefern waere. Genau dieser Fall war bisher der stille.
      #
      # Geprueft wird ueber den EXIT-CODE, nicht ueber eine Ausgabe: der Wert
      # darf nirgends erscheinen, auch nicht maskiert.
      - name: Voraussetzung pruefen
        if: ${{ steps.ableitung.outputs.namen != '' }}
        run: |
          set -euo pipefail
          if [ -z "${INFISICAL_TOKEN:-}" ]; then
            echo "::error::Secret INFISICAL_TOKEN fehlt — ohne es kommt der Job an keinen Supabase-PAT (AGE-506)."
            exit 1
          fi
          # Die einfachen Anfuehrungszeichen sind Absicht: expandieren soll die
          # INNERE Shell, die `infisical run` mit dem Secret befuellt — nicht
          # diese hier, die es nicht kennt.
          # shellcheck disable=SC2016
          if ! infisical run --env="$INFISICAL_ENV" --silent -- \
                 sh -c '[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]'; then
            echo "::error::SUPABASE_ACCESS_TOKEN liegt nicht in Infisical (env=$INFISICAL_ENV). Ohne Supabase-PAT kann keine Function ausgeliefert werden — und die Aenderung waere still nicht live (AGE-506)."
            exit 1
          fi

      - name: Ausliefern und nachlesen
        if: ${{ steps.ableitung.outputs.namen != '' }}
        env:
          NAMEN: ${{ steps.ableitung.outputs.namen }}
          BASIS: ${{ steps.basis.outputs.sha }}
        run: |
          set -euo pipefail

          # `find` statt `ls`: das Ausgabeformat von `ls` ist nicht zugesichert.
          alle="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"

          echo "### Ausgeliefert" >> "$GITHUB_STEP_SUMMARY"
          for fn in $NAMEN; do echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"; done

          # Das Uebergangene beim Namen nennen — sonst liest sich die
          # Beschraenkung hinterher als Vollstaendigkeit.
          # „in diesem Merge" waere jetzt falsch: die Basis kann viele Merges
          # zurueckliegen. Eine Ueberschrift, die weniger behauptet, als geprueft
          # wurde, ist genau der Fehler, den der Abschnitt verhindern soll.
          echo "### Uebergangen (unveraendert seit \`$BASIS\`)" >> "$GITHUB_STEP_SUMMARY"
          uebergangen=0
          for fn in $alle; do
            case " $NAMEN " in
              *" $fn "*) ;;
              *) echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"; uebergangen=$((uebergangen + 1)) ;;
            esac
          done
          [ "$uebergangen" -eq 0 ] && echo "- (keine)" >> "$GITHUB_STEP_SUMMARY"

          for refdatei in scripts/dev-project-ref.txt scripts/prod-project-ref.txt; do
            # Das Ziel kommt aus einer versionierten Datei, nicht aus einem
            # Secret: ein Ziel, das nur im Secret steht, ist im Review unsichtbar
            # (dieselbe Begruendung wie scripts/assert-target.ts).
            ref="$(tr -d '[:space:]' < "$refdatei")"
            # `infisical run` umschliesst NUR den supabase-Aufruf, nicht den
            # ganzen Block: der PAT lebt damit im Prozess, der ihn braucht, und
            # in keinem anderen.
            for fn in $NAMEN; do
              echo "::group::deploy $fn -> $ref"
              infisical run --env="$INFISICAL_ENV" --silent -- \
                supabase functions deploy "$fn" --project-ref "$ref"
              echo "::endgroup::"
            done

            # Dass ein Befehl fehlerfrei zurueckkam, ist kein Beleg dafuer, dass
            # das Ziel den neuen Stand traegt. Also nachlesen.
            echo "::group::functions list $ref"
            infisical run --env="$INFISICAL_ENV" --silent -- \
              supabase functions list --project-ref "$ref"
            echo "::endgroup::"
          done

      # Der Grund gehoert dazu. „Kein Function-Code in diesem Merge" waere
      # schlicht falsch, wenn in Wahrheit die Vergleichsbasis fehlte — und lesen
      # wuerde es sich wie ein unauffaelliger Lauf.
      - name: Nichts auszuliefern
        if: ${{ steps.ableitung.outputs.namen == '' }}
        env:
          BASIS: ${{ steps.basis.outputs.sha }}
          GRUND: ${{ steps.basis.outputs.grund }}
        run: |
          set -euo pipefail
          if [ -z "$BASIS" ]; then
            echo "Keine Vergleichsbasis ($GRUND) — es wurde nichts ausgeliefert."
          else
            echo "Seit $BASIS ($GRUND) aenderte sich kein Function-Code — es wurde nichts ausgeliefert."
          fi

      # ZULETZT, und mit Absicht nach dem Ausliefern: der Lauf soll noch
      # herausholen, was er sehen konnte, aber danach ROT enden. Die
      # `conclusion` dieses Jobs ist das Buch, aus dem der naechste Lauf seine
      # Basis liest — ein gruener Rueckfall schriebe „alles bis hierher ist
      # ausgeliefert" ueber eine Luecke, die niemand mehr aufmachen kann.
      #
      # Das blockiert weder `deploy` noch `migrate-dev`: beide haengen an
      # `migrate-dev` und `drift-gate`, nicht an diesem Job.
      - name: Rueckfall ist kein Nachweis
        if: ${{ steps.basis.outputs.rueckfall != '' }}
        env:
          GRUND: ${{ steps.basis.outputs.grund }}
        run: |
          echo "::error::$GRUND — dieser Lauf darf NICHT als ausgeliefert gelten. Ursache beheben; der naechste Lauf holt die Luecke dann nach."
          exit 1

  deploy:
    needs: [migrate-dev, drift-gate]
    # Auf Pull Requests werden beide Vorbedingungen uebersprungen; `!cancelled()`
    # laesst `deploy` dann trotzdem laufen. Auf main muss beides gruen sein —
    # ein Fehlschlag der Fruehwarnung bleibt so nicht lautlos.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      # Our Infisical org is on EU Cloud; the CLI defaults to US otherwise.
      INFISICAL_API_URL: https://eu.infisical.com/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so Sentry can associate commits

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # OFFEN (AGE-495, Audit 8.6): Dies ist eine Fremd-Shell, die als root
      # läuft. Ein Checksum-Pin ist nicht zu haben — Infisical verteilt die CLI
      # über den eigenen Artefaktserver, die GitHub-Releases tragen KEINE
      # Assets (am 2026-08-06 nachgemessen). Es bleiben zwei Wege, und beide
      # sind eine Entscheidung, kein Handgriff: das Setup-Skript per SHA-256
      # festnageln (bricht bei jeder legitimen Änderung ihrerseits) oder auf
      # `@infisical/cli` von npm wechseln (steht auf 0.43.120, während die
      # Go-CLI bei 0.162.16 ist — anderer Verteilweg, ungemessenes Verhalten).
      #
      # Was hier heute besser wird: kein `-E` mehr. Es reichte die GESAMTE
      # Job-Umgebung an die root-Shell durch, einschließlich INFISICAL_TOKEN,
      # CLOUDFLARE_API_TOKEN und SENTRY_AUTH_TOKEN. Das Setup-Skript braucht
      # nichts davon.
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical

      # `infisical run` injects the target env's secrets. On main, SENTRY_AUTH_TOKEN
      # (present in prod) + VITE_SENTRY_RELEASE make the Sentry vite plugin upload
      # hidden source-maps and create/finalize the release with commit association
      # (see vite.config.ts -> release.setCommits.auto). On previews the dev env has
      # no SENTRY_AUTH_TOKEN, so the plugin stays off — no Sentry noise per PR.
      - name: Build
        env:
          VITE_SENTRY_RELEASE: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: infisical run --env="$INFISICAL_ENV" -- pnpm build

      # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from the env
      # that infisical injects. The branch name is attacker-controllable, so it is
      # passed via env and quoted, never interpolated into the shell.
      #
      # `pnpm exec`, nicht `pnpm dlx wrangler@4`: dlx löste die Version bei
      # JEDEM Deploy neu auf und lud sie ohne Integritätsprüfung — das Werkzeug,
      # das unser Produktions-Frontend hochlädt, war das einzige ungepinnte
      # Stück der Kette. wrangler steht jetzt als devDependency im Lockfile.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CF_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          # pipefail so a wrangler failure isn't masked by the `tee` exit code.
          set -euo pipefail
          infisical run --env="$INFISICAL_ENV" -- \
            pnpm exec wrangler pages deploy ./dist \
              --project-name=fbc-platform --branch="$CF_BRANCH" | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- cf-pages-preview -->';
            const body = `${marker}\n🚀 **Cloudflare Pages preview:** ${url}\n\n_Deployed from ${context.sha.slice(0, 7)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
