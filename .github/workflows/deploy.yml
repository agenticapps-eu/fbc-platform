name: Deploy

# Pull requests -> Cloudflare Pages preview deploy.
# Push to main   -> production deploy + Sentry release (commits + source-maps).
#
# Secrets are injected by the Infisical CLI (`infisical run`) using a single
# service token (INFISICAL_TOKEN). prod env on main, dev env for previews.
on:
  push:
    branches: [main]
  pull_request:

# One in-flight deploy per ref; a newer push supersedes an older one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  # Migrationen automatisch auf DEV, sobald sie auf main liegen (AGE-257).
  #
  # NICHT auf Pull Requests: sonst mutierte jeder offene PR das DEV-Projekt mit
  # ungereviewten Migrationen, und zwei parallele PRs schrieben sich gegenseitig
  # in die Historie.
  #
  # Warum DEV automatisch und PROD nicht: `ci.yml` belegt mit `supabase db
  # reset` nur, dass eine Migration auf eine LEERE Datenbank passt. Ein `not
  # null` ohne Default auf einer gefuellten Tabelle ist in CI gruen und
  # scheitert erst an Daten. Genau das faengt dieser Lauf ab, wo es folgenlos
  # ist.
  migrate-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Stufe 1 auch hier — dieselbe gepruefte Funktion wie `pnpm db:push:prod`.
      # Ohne sie schriebe dieser Job unbeaufsichtigt auf das Projekt, das
      # zufaellig im Secret steht: stuende dort die PROD-URL, liefen Migrationen
      # bei jedem Merge ohne Bestaetigung auf die Produktivdatenbank — und
      # `drift-gate` waere danach gruen, weil PROD dann zum Repo passt.
      # Ein unabhaengiges Review hat diese Luecke am 2026-08-05 gefunden.
      - name: Ziel pruefen — muss das DEV-Projekt sein
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: pnpm tsx scripts/assert-target.ts dev

      - name: Migrationen auf DEV anwenden
        env:
          SUPABASE_DB_URL_DEV: ${{ secrets.SUPABASE_DB_URL_DEV }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_DEV"

  # Fruehwarnung vor dem Deploy: weicht die Migrationshistorie von PROD ab,
  # faehrt kein Frontend aus (AGE-257).
  #
  # Misst gegen denselben `github.sha`, den `deploy` ausliefert — beide Jobs
  # liegen im selben Lauf und checken denselben Commit aus.
  #
  # Kein Break-Glass, bewusst: sobald ein Merge eine Migration enthaelt,
  # blockiert dieses Gate JEDEN Deploy, bis jemand `migrate-prod` freigibt —
  # auch einen eiligen Fix, der mit der Migration nichts zu tun hat. Eine
  # Zusage, die man im Eilfall umgehen darf, ist im Eilfall keine.
  drift-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Das Gate wird rot, wenn es nicht messen KANN (fehlendes Secret, DB
      # nicht erreichbar, geaendertes CLI-Ausgabeformat) — nicht nur, wenn es
      # Drift findet. Die Auswertung ist in scripts/migration-drift.logic.ts
      # geprueft; `version: latest` oben heisst, dass die CLI sich unter uns
      # aendern darf, und genau das ist am 2026-08-05 passiert.
      - name: Migrationshistorie gegen PROD vergleichen
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: pnpm tsx scripts/migration-drift-gate.ts

  # Edge Functions auf BEIDE Projekte ausrollen (AGE-506).
  #
  # WARUM ES DIESEN JOB GIBT. Bis hierher rollte CI zwei der drei Flaechen aus —
  # Frontend und Migrationen — und Functions gar nicht. Das ist zweimal
  # aufgeschlagen: bei AGE-495/B2 existierten die drei Aktivierungs-Functions auf
  # PROD ueberhaupt nicht, waehrend der Change als „live" galt; und der
  # Code-Review zu PR #133 musste melden, dass ein PR `send-activation` aendert,
  # ohne dass irgendetwas sie ausliefert. Die Gegenmassnahme war eine Merkregel.
  # Eine Regel, an die gedacht werden muss, ist genau das, was zweimal versagt hat.
  #
  # WARUM DIESELBEN VORBEDINGUNGEN WIE `deploy`. Eine Function kann eine
  # Datenbankfunktion aufrufen, die auf dem Ziel noch nicht angelegt ist — auf
  # PROD laufen Migrationen nur ueber `migrate-prod`, also von Hand. Liefe dieser
  # Job voraus, waere die Function dort sofort kaputt. `drift-gate` blockiert
  # bereits jeden Deploy, sobald PRODs Migrationshistorie vom Repo abweicht; die
  # Function erbt diesen Schutz, statt einen zweiten danebenzustellen.
  #
  # WARUM NUR GEAENDERTE. `supabase functions deploy` ohne Namen deployt alle
  # sechs. Auf PROD liegt fuer `notify-contact-request` bewusst ein aelterer
  # Stand (member-activation-flow, Aufgabe 11.4) — ein pauschaler Lauf zoege ihn
  # stillschweigend mit. Was uebergangen wird, steht deshalb NAMENTLICH im
  # Protokoll: eine Beschraenkung, die nicht ausgesprochen wird, liest sich
  # hinterher wie Vollstaendigkeit.
  functions:
    needs: [migrate-dev, drift-gate]
    # Nur auf main, und nur wenn beide Vorbedingungen nicht fehlgeschlagen sind —
    # dieselbe Bedingung wie `deploy` eine Etage tiefer.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2 # HEAD^ wird fuer die Ableitung gebraucht
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Die Ableitung steht in scripts/changed-functions.logic.ts und hat dort
      # einen Test daneben — nicht hier als Shell-Zeile, die niemand prueft.
      - name: Geaenderte Functions ableiten
        id: ableitung
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q "HEAD^" >/dev/null; then
            echo "::warning::Kein Vorgaenger-Commit vorhanden (erster Commit oder Force-Push). Es wird nichts ausgeliefert."
            echo "namen=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          namen="$(git diff --name-only "HEAD^" HEAD | pnpm tsx scripts/changed-functions.ts | tr '\n' ' ')"
          echo "Abgeleitet: ${namen:-<keine>}"
          echo "namen=$namen" >> "$GITHUB_OUTPUT"

      # Ohne Token kaeme aus der CLI eine unverstaendliche Meldung. Dieser Schritt
      # sagt stattdessen, was fehlt — und er schlaegt NUR fehl, wenn tatsaechlich
      # etwas auszuliefern waere. Genau dieser Fall war bisher der stille.
      - name: Voraussetzung pruefen
        if: ${{ steps.ableitung.outputs.namen != '' }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt. Ohne Supabase-PAT kann keine Function ausgeliefert werden — und die Aenderung waere still nicht live (AGE-506)."
            exit 1
          fi

      - name: Ausliefern und nachlesen
        if: ${{ steps.ableitung.outputs.namen != '' }}
        env:
          NAMEN: ${{ steps.ableitung.outputs.namen }}
        run: |
          set -euo pipefail

          # `find` statt `ls`: das Ausgabeformat von `ls` ist nicht zugesichert.
          alle="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)"

          echo "### Ausgeliefert" >> "$GITHUB_STEP_SUMMARY"
          for fn in $NAMEN; do echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"; done

          # Das Uebergangene beim Namen nennen — sonst liest sich die
          # Beschraenkung hinterher als Vollstaendigkeit.
          echo "### Uebergangen (unveraendert in diesem Merge)" >> "$GITHUB_STEP_SUMMARY"
          uebergangen=0
          for fn in $alle; do
            case " $NAMEN " in
              *" $fn "*) ;;
              *) echo "- \`$fn\`" >> "$GITHUB_STEP_SUMMARY"; uebergangen=$((uebergangen + 1)) ;;
            esac
          done
          [ "$uebergangen" -eq 0 ] && echo "- (keine)" >> "$GITHUB_STEP_SUMMARY"

          for refdatei in scripts/dev-project-ref.txt scripts/prod-project-ref.txt; do
            # Das Ziel kommt aus einer versionierten Datei, nicht aus einem
            # Secret: ein Ziel, das nur im Secret steht, ist im Review unsichtbar
            # (dieselbe Begruendung wie scripts/assert-target.ts).
            ref="$(tr -d '[:space:]' < "$refdatei")"
            for fn in $NAMEN; do
              echo "::group::deploy $fn -> $ref"
              supabase functions deploy "$fn" --project-ref "$ref"
              echo "::endgroup::"
            done

            # Dass ein Befehl fehlerfrei zurueckkam, ist kein Beleg dafuer, dass
            # das Ziel den neuen Stand traegt. Also nachlesen.
            echo "::group::functions list $ref"
            supabase functions list --project-ref "$ref"
            echo "::endgroup::"
          done

      - name: Nichts auszuliefern
        if: ${{ steps.ableitung.outputs.namen == '' }}
        run: echo "Kein Function-Code in diesem Merge — es wurde nichts ausgeliefert."

  deploy:
    needs: [migrate-dev, drift-gate]
    # Auf Pull Requests werden beide Vorbedingungen uebersprungen; `!cancelled()`
    # laesst `deploy` dann trotzdem laufen. Auf main muss beides gruen sein —
    # ein Fehlschlag der Fruehwarnung bleibt so nicht lautlos.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
      INFISICAL_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
      # Our Infisical org is on EU Cloud; the CLI defaults to US otherwise.
      INFISICAL_API_URL: https://eu.infisical.com/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so Sentry can associate commits

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # OFFEN (AGE-495, Audit 8.6): Dies ist eine Fremd-Shell, die als root
      # läuft. Ein Checksum-Pin ist nicht zu haben — Infisical verteilt die CLI
      # über den eigenen Artefaktserver, die GitHub-Releases tragen KEINE
      # Assets (am 2026-08-06 nachgemessen). Es bleiben zwei Wege, und beide
      # sind eine Entscheidung, kein Handgriff: das Setup-Skript per SHA-256
      # festnageln (bricht bei jeder legitimen Änderung ihrerseits) oder auf
      # `@infisical/cli` von npm wechseln (steht auf 0.43.120, während die
      # Go-CLI bei 0.162.16 ist — anderer Verteilweg, ungemessenes Verhalten).
      #
      # Was hier heute besser wird: kein `-E` mehr. Es reichte die GESAMTE
      # Job-Umgebung an die root-Shell durch, einschließlich INFISICAL_TOKEN,
      # CLOUDFLARE_API_TOKEN und SENTRY_AUTH_TOKEN. Das Setup-Skript braucht
      # nichts davon.
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical

      # `infisical run` injects the target env's secrets. On main, SENTRY_AUTH_TOKEN
      # (present in prod) + VITE_SENTRY_RELEASE make the Sentry vite plugin upload
      # hidden source-maps and create/finalize the release with commit association
      # (see vite.config.ts -> release.setCommits.auto). On previews the dev env has
      # no SENTRY_AUTH_TOKEN, so the plugin stays off — no Sentry noise per PR.
      - name: Build
        env:
          VITE_SENTRY_RELEASE: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: infisical run --env="$INFISICAL_ENV" -- pnpm build

      # wrangler reads CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from the env
      # that infisical injects. The branch name is attacker-controllable, so it is
      # passed via env and quoted, never interpolated into the shell.
      #
      # `pnpm exec`, nicht `pnpm dlx wrangler@4`: dlx löste die Version bei
      # JEDEM Deploy neu auf und lud sie ohne Integritätsprüfung — das Werkzeug,
      # das unser Produktions-Frontend hochlädt, war das einzige ungepinnte
      # Stück der Kette. wrangler steht jetzt als devDependency im Lockfile.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CF_BRANCH: ${{ github.head_ref || 'main' }}
        run: |
          # pipefail so a wrangler failure isn't masked by the `tee` exit code.
          set -euo pipefail
          infisical run --env="$INFISICAL_ENV" -- \
            pnpm exec wrangler pages deploy ./dist \
              --project-name=fbc-platform --branch="$CF_BRANCH" | tee deploy.log
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- cf-pages-preview -->';
            const body = `${marker}\n🚀 **Cloudflare Pages preview:** ${url}\n\n_Deployed from ${context.sha.slice(0, 7)}._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
