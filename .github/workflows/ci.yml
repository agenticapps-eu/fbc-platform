name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, type-check, unit tests and a production build. No secrets needed:
  # `pnpm build` stays a plain `tsc && vite build` (see docs/secrets.md).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Migration validation: boot a throwaway local Supabase stack and apply every
  # migration from scratch. `supabase db reset` exits non-zero if any migration
  # fails to apply cleanly — that is the dry-run/validate gate. No secrets needed.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from a clean database
        run: supabase db reset
      # Die Rechte-Matrix ist die Sicherheitsgrenze des Projekts (CLAUDE.md:
      # „Sichtbarkeit wird in der DB per RLS erzwungen, nicht nur im Frontend").
      # Dass die Migrationen SAUBER LAUFEN, sagt nichts darüber, ob sie das
      # RICHTIGE erlauben — dafür dieser Lauf (AGE-311).
      #
      # Bewusst nur rls_test.sql und nicht das ganze Verzeichnis: die
      # probe_*.sql sind manuelle begin/rollback-Skripte ohne plan()/finish()
      # und damit kein pgTAP — pg_prove würde an ihnen scheitern.
      - name: DIAGNOSE grants (temporär, AGE-311)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "
            select table_name, grantee, string_agg(privilege_type, ',' order by privilege_type) as privs
            from information_schema.role_table_grants
            where table_schema = 'public'
              and table_name in ('profiles','profile_interests','profile_theme_scores','offers','posts','events')
              and grantee in ('anon','authenticated')
            group by table_name, grantee
            order by table_name, grantee;"
      - name: Verify the RLS rights matrix (pgTAP)
        run: supabase test db supabase/tests/rls_test.sql

  # Enforce a Conventional-Commit-style PR title (the squash-merge commit subject).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
