name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, type-check, unit tests and a production build. No secrets needed:
  # `pnpm build` stays a plain `tsc && vite build` (see docs/secrets.md).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # AGE-642: Dieses Repository ist OEFFENTLICH. Ein Signaturgeheimnis, das
      # einmal gepusht wurde, gilt als offengelegt — die Antwort darauf ist eine
      # Rotation im Apple- bzw. Google-Portal, kein `git rm`. Am 23.08. ist
      # genau dieser Fall schon einmal eingetreten.
      #
      # Der Waechter prueft den BAUM, nicht den Diff: ein Geheimnis, das seit
      # drei Wochen liegt, fasst kein aktueller Commit an und waere fuer jede
      # Diff-Pruefung unsichtbar. Das funktioniert auch mit dem flachen Klon von
      # `actions/checkout` — der Arbeitsbaum ist dort vollstaendig, nur die
      # Historie ist es nicht.
      #
      # Steht VOR lint/typecheck/test, weil ein Fund jede weitere Minute
      # Rechenzeit sinnlos macht: dann ist nicht der Build das Problem.
      - name: Kein natives Geheimnis im Baum
        run: pnpm tsx scripts/native-secrets-guard.ts

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # AGE-642: Keine Seite darf beim ersten Aufruf mitgeladen werden ausser
      # denen, die der erste Bildschirm braucht. Eine Zahl allein taugt dafuer
      # nicht — sie driftet mit dem naechsten Feature und sagt beim
      # Ueberschreiten nicht, wer sie verschoben hat. Der Waechter liest die
      # Source-Maps der gesamten Erstlast (Eintritt plus jede vorgeladene
      # Datei) und bricht ab, wenn er dort eine Seite findet, die nicht in
      # seiner Erlaubnisliste steht.
      #
      # Steht hinter `pnpm build`, weil er das Bauergebnis braucht; er bricht
      # von sich aus ab, wenn dieses Ergebnis unvollstaendig ist.
      - name: Keine Seite ausser dem ersten Bildschirm in der Erstlast
        run: pnpm tsx scripts/entry-chunk-guard.ts

      # Zwei Zusagen aus AGE-492, die KEIN Typecheck halten kann, weil beide
      # Strings sind: Tailwind-Klassennamen prüft TypeScript nicht, und eine
      # Font-URL ist nur Text. Ohne diesen Schritt schleichen sie sich in C2–C6
      # lautlos zurück — genau deshalb steht die Abnahme hier und nicht nur in
      # einer Checkliste.
      - name: No retired design tokens, no third-party fonts
        run: |
          fail=0

          # `gold` als Token/Utility. src/vision/ ist ausgenommen: der eingefrorene
          # eff.bee.zee-Vision-Dummy (AGE-492 §3) hat einen eigenen --ebz-gold-
          # Namensraum, wird von nirgends importiert und landet in keinem Bundle.
          #
          # `*.generated.ts` ebenfalls, seit AGE-645: das sind INHALTSDATEN, keine
          # Auszeichnung. Der deutsche Emoji-Datensatz enthält „Goldmedaille",
          # „golden gate" und „Goldesel" als Suchbegriffe — sechs Treffer, die mit
          # Design-Tokens nichts zu tun haben und aus denen nie ein Klassenname
          # wird. Diese Prüfung sucht als einzige das BLOSSE WORT statt der
          # Token-Form (siehe die Begründung im nächsten Block, die genau davor
          # warnt); solange das so ist, wird sie an jedem deutschen Inhalt mit
          # „Gold…" hängenbleiben. Erzeugte Dateien auszunehmen behebt die Klasse
          # für Inhaltsdaten, ohne die Schärfe für handgeschriebenen Code zu
          # verlieren — gemessen: ausserhalb der erzeugten Dateien null Treffer.
          if grep -rniI "gold" src/ --exclude-dir=vision --exclude='*.generated.ts'; then
            echo "::error::'gold' ist seit AGE-492 kein Token mehr — bitte 'accent' verwenden."
            fail=1
          fi

          # Die übrigen zurückgezogenen Namen. Bewusst die exakten Token-/Attribut-
          # Formen statt der bloßen Wörter: `night` steht noch in genau einem
          # Kommentar, der die Umbenennung dokumentiert, und den soll die Prüfung
          # nicht abschießen.
          if grep -rnI -e "--color-night" -e "--accent2" -e "--color-fmt-" \
              -e "data-card-style" src/ --exclude-dir=vision; then
            echo "::error::Zurückgezogener Token/Mechanismus aus AGE-492 — siehe openspec/specs/design-system."
            fail=1
          fi

          # Schriften kommen vom eigenen Origin (DSGVO, AGE-492 §6).
          if grep -rnI -e "fonts\.googleapis" -e "fonts\.gstatic" src/ index.html; then
            echo "::error::Schriften müssen selbst gehostet werden (public/fonts/)."
            fail=1
          fi

          exit $fail

  # Die Edge Functions sind Deno, nicht Node — `pnpm test` im Job `verify` sieht
  # sie deshalb NIE. Bis hierher lief also keiner dieser 33 Tests je in CI,
  # obwohl sie genau die Grenzen prüfen, an denen Fremdverkehr ankommt:
  # Stripe-Signatur (manipulierter Body, falsches Secret, veralteter
  # Zeitstempel), Open-Redirect in `resolveReturnBase`, HTML-Escaping in den
  # Mail-Templates und das Fail-Closed ohne `old_record`.
  #
  # Ohne Netz und ohne Secrets: die Tests importieren nur die reinen Module
  # (emails.ts, webhook.ts, checkout.ts), nicht `index.ts` mit seinem
  # Deno.serve. --frozen prüft nebenbei, dass deno.lock zum Code passt.
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno-Tests der Edge Functions
        # `--allow-read` ist auf `supabase/functions` BEGRENZT und nicht pauschal:
        # gebraucht wird es von genau einer Sorte Zusage — der, die eine
        # `index.ts` als Text liest und belegt, dass sie ihr Modul daneben
        # wirklich aufruft (AGE-641, `anbieter.test.ts`). Warum es diese Sorte
        # braucht, steht im Kommentar unter diesem Schritt.
        #
        # Ohne die Grenze waere es ein Freibrief fuers ganze Dateisystem, um
        # sechs Dateien zu lesen. Und ohne das Flag ueberhaupt war der Lauf
        # LOKAL gruen und in CI rot: hier stand `--allow-net --allow-env`, im
        # Terminal lief `--allow-read` mit. Wer eine solche Zusage ergaenzt,
        # faehrt diese Zeile woertlich, nicht die bequemere.
        run: deno test --frozen --allow-env --allow-net --allow-read=supabase/functions supabase/functions/
      # `deno test` typprüft nur, was ein Test importiert — und das sind gerade
      # die reinen Module, nicht die `index.ts`. Ein Verdrahtungsfehler zwischen
      # `index.ts` und dem Modul daneben käme also grün durch. Aufgefallen beim
      # Herauslösen von `redeem.ts` (AGE-495): `supabase.rpc()` gibt einen
      # PostgrestFilterBuilder zurück, kein Promise — nur `deno check` sieht das.
      - name: Typprüfung der Edge Functions
        # `*/*.ts` statt `**/*.ts`: In bash ohne `globstar` steht `**` für eine
        # einzige Ebene, der Ausdruck sähe also nur zufällig richtig aus.
        run: deno check supabase/functions/*/*.ts

  # Migration validation: boot a throwaway local Supabase stack and apply every
  # migration from scratch. `supabase db reset` exits non-zero if any migration
  # fails to apply cleanly — that is the dry-run/validate gate. No secrets needed.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          # Feste Nummer statt `latest` (AGE-622). `latest` hat am 27.08. `main`
          # rot gemacht, ohne dass sich eine Zeile geaendert hatte: derselbe
          # Commit war am Vorabend gruen. Die neue Abbildung vergibt Rechte
          # ROLLEN-EIGEN statt ueber `public`, und drei zu eng geschriebene
          # Entzuege fielen damit auf.
          #
          # Gepinnt wird auf die NEUE Sorte, nicht zurueck auf die alte. Sie ist
          # die, die PROD gleicht — AGE-602 hat das am PROD-Katalog gemessen
          # (proacl mit anon/authenticated/service_role je EIGENEM Grant). Auf
          # die alte zu pinnen haette `main` in einer Minute gruen gemacht und
          # die Zusagen dauerhaft blind gestellt.
          #
          # Wer diese Nummer anhebt, hebt damit die Rechte-Grundlage an: erst
          # `supabase test db` mit der FRISCHEN Abbildung laufen lassen, nicht
          # gegen einen bestehenden lokalen Datentraeger. Der traegt die alte
          # Sorte weiter und ist gegen genau diese Fehlerklasse blind.
          version: 2.116.0
      - name: Start local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from a clean database
        run: supabase db reset
      # Die Rechte-Matrix ist die Sicherheitsgrenze des Projekts (CLAUDE.md:
      # „Sichtbarkeit wird in der DB per RLS erzwungen, nicht nur im Frontend").
      # Dass die Migrationen SAUBER LAUFEN, sagt nichts darüber, ob sie das
      # RICHTIGE erlauben — dafür dieser Lauf.
      #
      # Zwei Suites, zwei Fragen: grants_test.sql prüft, WELCHE OPERATIONEN
      # anon/authenticated überhaupt offenstehen; rls_test.sql, WELCHE ZEILEN
      # sie davon sehen. Beides muss stimmen — ein Grant ohne Policy ist totes
      # Gewicht, eine Policy ohne Grant ist tot (AGE-311, AGE-312).
      #
      # Bewusst diese Dateien und nicht das ganze Verzeichnis: die probe_*.sql
      # sind manuelle begin/rollback-Skripte ohne plan()/finish() und damit kein
      # pgTAP — pg_prove würde an ihnen scheitern. Wer hier einen Test ergänzt,
      # muss ihn auch in diese Zeile eintragen, sonst läuft er nie.
      #
      # directory_search_test.sql (AGE-494) prüft die dritte Frage: WELCHE FELDER
      # die Verzeichnis-RPC preisgibt. Die Kompass-Kategorien sagen jetzt, was
      # jemand sucht — nicht mehr nur, dass er sucht.
      #
      # Die beiden member_lifecycle-Dateien kamen am 24.08. dazu — sie standen
      # seit dem 23.08. als vollwertiges pgTAP im Repo (plan()/finish(), 46k
      # zusammen) und liefen KEIN EINZIGES MAL in CI, weil niemand sie in diese
      # Zeile eingetragen hatte. Genau der Fall, vor dem der Absatz darüber
      # warnt. Gefunden bei der Diff-Prüfung zu AGE-581.
      #
      # `display_name_test.sql` kam am 28.08. dazu und war derselbe Fall: 14
      # Zusagen, seit dem 26.08. auf der Platte, nie gelaufen. Die Warnung oben
      # steht seit dem 05.08. da — sie hat in beiden Fällen nicht gereicht,
      # nach 18 bzw. 23 Tagen. Seitdem prüft
      # `scripts/pgtap-dateiliste.test.ts` diese Liste gegen das Verzeichnis,
      # in beide Richtungen, im Job `verify`.
      - name: Verify the grant + RLS rights matrix (pgTAP)
        run: >
          supabase test db
          supabase/tests/grants_test.sql
          supabase/tests/rls_test.sql
          supabase/tests/directory_search_test.sql
          supabase/tests/admin_member_list_test.sql
          supabase/tests/admin_feedback_test.sql
          supabase/tests/member_lifecycle_test.sql
          supabase/tests/member_lifecycle_rpc_test.sql
          supabase/tests/post_saves_test.sql
          supabase/tests/feed_popularity_test.sql
          supabase/tests/feed_sidebar_test.sql
          supabase/tests/thread_read_positions_test.sql
          supabase/tests/hinweistypen_test.sql
          supabase/tests/notify_contact_request_daten_test.sql
          supabase/tests/thread_aktivitaet_test.sql
          supabase/tests/release_notes_test.sql
          supabase/tests/admin_set_tier_test.sql
          supabase/tests/release_entry_skips_test.sql
          supabase/tests/push_tokens_test.sql
          supabase/tests/push_zustellung_test.sql
          supabase/tests/display_name_test.sql
          supabase/tests/geplante_beitraege_test.sql
          supabase/tests/ota_buendel_test.sql
          supabase/tests/push_token_aufraeumen_test.sql
          supabase/tests/feedback_themes_test.sql
          supabase/tests/feedback_screenshots_test.sql
          supabase/tests/admin_gespraech_test.sql

      # Die Datenschicht des Feeds gegen den LAUFENDEN Stack (AGE-582, 5.13).
      #
      # Sie haengt an diesem Job und nicht an `verify`, weil sie einen echten
      # PostgREST braucht: `.overlaps()` gegen `.contains()`, das Filtern von
      # Eltern nach Kindern (`post_media=is.null`), der `post_saves!inner`-Join
      # unter der RLS und der Keyset-Cursor sind alles Zusagen ueber das, was
      # der SERVER tut. Ein Mock des Query-Builders zeichnet nur auf, was der
      # Client sagt — und war damit gruen, waehrend `.contains()` bei zwei
      # gewaehlten Marken null Zeilen lieferte.
      #
      # Der Lauf ist bewusst getrennt und NICHT zur Laufzeit uebersprungen: ein
      # `skipIf(!stackErreichbar)` waere ueberall gruen, auch dort, wo nie etwas
      # lief — derselbe Fehler wie die beiden member_lifecycle-Dateien oben.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Feed data layer against the running stack (vitest)
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            pnpm test:integration

  # Enforce a Conventional-Commit-style PR title (the squash-merge commit subject).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
