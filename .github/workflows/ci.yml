name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint, type-check, unit tests and a production build. No secrets needed:
  # `pnpm build` stays a plain `tsc && vite build` (see docs/secrets.md).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Migration validation: boot a throwaway local Supabase stack and apply every
  # migration from scratch. `supabase db reset` exits non-zero if any migration
  # fails to apply cleanly — that is the dry-run/validate gate. No secrets needed.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply all migrations from a clean database
        run: supabase db reset

  # Enforce a Conventional-Commit-style PR title (the squash-merge commit subject).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
