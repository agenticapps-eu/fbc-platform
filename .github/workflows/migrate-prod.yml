name: Migrate PROD

# Migrationen auf das PROD-Supabase-Projekt anwenden — nur von Hand, nur mit
# Freigabe (AGE-496 Task 4.3, schliesst AGE-257).
#
# Warum PROD nicht automatisch laeuft: ein DDL-Rollback ist kein `git revert`.
# DEV traegt ausserdem Demo-Personas — alles, was an der BESCHAFFENHEIT echter
# Daten haengt (Dubletten unter einem neuen Unique-Index, gewachsene Altwerte,
# die ein neuer Check ablehnt), sieht der DEV-Lauf nie. Der Dry-Run unten wird
# deshalb GELESEN, nicht durchgeklickt.
#
# Eigener Workflow statt eines Jobs in deploy.yml: ein `workflow_dispatch` dort
# loeste auch einen Deploy aus, und deploy.yml's `cancel-in-progress: true`
# duerfte nie eine laufende PROD-Migration abbrechen.
on:
  workflow_dispatch:

# Nie zwei Migrationslaeufe gleichzeitig — und ein laufender wird NICHT
# abgebrochen.
concurrency:
  group: migrate-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # um den migrate-dev-Lauf desselben Commits nachzuschlagen

jobs:
  # Alles Lesbare entsteht hier, VOR der Freigabe: der aufgeloeste Zielhost,
  # der Drift-Vergleich und der Dry-Run. Die Freigabe unten wird auf dieses Log
  # erteilt, nicht auf eine Absichtserklaerung.
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Was DEV nicht getragen hat, geht nicht auf PROD. Ohne diese Pruefung
      # waere die Reihenfolge DEV->PROD eine Bitte statt einer Zusage.
      - name: Belegen, dass migrate-dev fuer DIESEN Commit gruen war
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.path == ".github/workflows/deploy.yml") | .id')"
          if [ -z "$runs" ]; then
            echo "::error::Kein deploy.yml-Lauf fuer $SHA gefunden. Ist der Commit auf main?"
            exit 1
          fi
          ok=0
          for id in $runs; do
            conclusion="$(gh api "repos/$REPO/actions/runs/$id/jobs" \
              --jq '.jobs[] | select(.name == "migrate-dev") | .conclusion')"
            echo "Lauf $id -> migrate-dev: ${conclusion:-<nicht vorhanden>}"
            case "$conclusion" in *success*) ok=1 ;; esac
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Fuer $SHA liegt kein erfolgreicher migrate-dev-Lauf vor. PROD kommt nach DEV, nicht davor."
            exit 1
          fi

      # Dieselbe Stufe-1-Pruefung wie `pnpm db:push:prod`, dieselbe Funktion —
      # keine zweite Regex im YAML. Zeigt Ref und Host, nie die URL.
      - name: Zielhost aufloesen
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: pnpm tsx scripts/assert-target.ts prod

      - name: Migrationshistorie vergleichen
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: pnpm tsx scripts/migration-drift-gate.ts || true # hier informativ: die Abweichung IST der Anlass

      - name: Was angewendet wuerde (--dry-run)
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_PROD" --dry-run

  # ⚠️ ACHTUNG — `environment: production` traegt DERZEIT KEINE Reviewer-Regel.
  #    Zurueckgestellt am 2026-08-05 (Donald ist der einzige Entwickler). Dieser
  #    Job startet damit DIREKT hinter `plan`: Zielhost und Dry-Run stehen im
  #    Log, aber niemand muss sie gesehen haben. Ein frueherer Kommentar hier
  #    behauptete das Gegenteil — aufgedeckt vom Review am 2026-08-05.
  #    Nachziehen, sobald ein Zweiter Schreibrechte auf `main` hat; Befehl in
  #    docs/supabase-environments.md.
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Auch hier, nicht nur in `plan`: der SCHREIBENDE Befehl prueft sein
      # eigenes Ziel. `plan` laeuft in einem anderen Runner und liest das Secret
      # ein zweites Mal — und sobald die Reviewer-Regel nachgezogen wird, liegt
      # zwischen beiden ein beliebig langes Fenster.
      - name: Ziel pruefen — muss das PROD-Projekt sein
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: pnpm tsx scripts/assert-target.ts prod

      - name: Migrationen anwenden
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: supabase db push --db-url "$SUPABASE_DB_URL_PROD"

      - name: Historie nachher — muss abweichungsfrei sein
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: pnpm tsx scripts/migration-drift-gate.ts

      # Objekt-Drift: findet, was in der DB steht und in keiner Migration —
      # und vor allem, was FEHLT, obwohl es dort sein muss. Der
      # Webhook-Trigger wandert nicht mit `db push`; verschwindet er, stirbt
      # der Mailversand still.
      #
      # ⚠️ DB_SCAN_TLS_INSECURE: der Supabase-Pooler zeigt eine selbstsignierte
      #    Kette, und die projekt-eigene CA gibt es nur ueber das Dashboard
      #    (die frueher dokumentierte Sammel-URL antwortet 404). Die Verbindung
      #    ist verschluesselt, der Server aber nicht authentifiziert. Das steht
      #    hier sichtbar statt in einer Vorgabe versteckt — offener Nachlauf:
      #    CA hinterlegen und DB_SCAN_CA_CERT setzen.
      - name: Objekt-Drift-Scan
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          DB_SCAN_TLS_INSECURE: "1"
        run: pnpm tsx scripts/db-drift-scan.ts
