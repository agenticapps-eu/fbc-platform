<!doctype html><meta charset="utf-8"><title>Feature Graphic</title>
<style>
  @font-face { font-family: "Fraunces"; src: url("/fonts/fraunces-latin.woff2") format("woff2");
               font-weight: 100 900; font-display: block; }
  @font-face { font-family: "Inter"; src: url("/fonts/inter-latin.woff2") format("woff2");
               font-weight: 100 900; font-display: block; }
  html, body { margin: 0; }
  body { width: 1024px; height: 500px; overflow: hidden;
         background: radial-gradient(120% 140% at 78% 18%, #16376e 0%, #0c2043 58%, #081733 100%);

  .wort svg { width: 66px; height: 66px; }
  .wort svg path { fill: #ffffff; }
  .name { font-size: 58px; font-weight: 700; letter-spacing: -.022em; }
  .punkt { color: #5b90e0; }
  h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 76px;
       line-height: 1.03; letter-spacing: -.018em; margin: 30px 0 16px; }
  p  { font-size: 27px; color: #b9c8e4; margin: 0; letter-spacing: .004em; }
  .inhalt { position: relative; z-index: 1; }
</style>
